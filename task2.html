
<!DOCTYPE html>
<html lang="en">
<head>
  <title>Three Div Boxes</title>
  <style>
    div {
      border: 2px solid rgb(227, 10, 90);
      padding: 15px;
      margin: 10px;
      width: 150px;
      height: 150px;
    }
    .box-two {
      background-color:rgb(43, 0, 128);
      color:blue;
      font-size: 18px;
      text-align: center;
    }
    #box-three {
      background-color: rgb(226, 8, 8);
      color: rgba(0, 0, 0, 0.93);
      font-family: times new roman;
      text-align: right;
    }
  </style>
</head>
<body>
  <div>First div</div>
  <div class="box-two">Second div</div>
  <div id="box-three">Third div</div>
</body>
</html>
